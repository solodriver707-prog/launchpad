# One-click deploy of the treid indexer on Render (free plan).
# Render → New → Blueprint → pick this repo. You'll be asked for RPC and PARTNER.
services:
  - type: web
    name: treid-indexer
    runtime: docker
    plan: free
    rootDir: chain/indexer
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: RPC          # Helius devnet URL, e.g. https://devnet.helius-rpc.com/?api-key=...
        sync: false
      - key: PARTNER      # treid wallet that receives fees (fee claimer of every treid config)
        sync: false
      - key: OPS_SECRET   # random seed for the hot ops wallet (fee claimer + tax distributor) — generated by Render, never shown
        generateValue: true
      - key: PINATA_JWT   # Pinata API JWT — permanent coin images/metadata on IPFS
        sync: false
      - key: OPS_EVERY_MIN
        value: "10"
      - key: SOL_USD      # fallback SOL price if the live price can't be fetched
        value: "150"
# Mainnet: switch `plan: free` to `plan: starter` and uncomment the disk + DB lines below.
# The database is only a cache (coins, trades, rewards and tax receipts all rebuild from the chain),
# a disk just makes restarts instant instead of re-reading the whole history.
#   disk:
#     name: treid-data
#     mountPath: /data
#     sizeGB: 1
#   (add env var)  - key: DB
#                    value: /data/treid.db
