# Mainnet indexer — create it in Render with "New → Blueprint" and pick this repo.
# The existing devnet service is not touched by this file. Secret values (sync: false) are asked for on creation.
services:
  - type: web
    name: treid-indexer-mainnet
    runtime: docker
    rootDir: chain/indexer
    dockerfilePath: ./Dockerfile
    plan: starter            # paid instance: never sleeps (free instances stop after 15 min idle — ops would stop paying)
    region: frankfurt
    healthCheckPath: /api/health
    disk:
      name: treid-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: CLUSTER
        value: mainnet
      - key: DB
        value: /data/treid.db
      - key: OPS_PRIORITY_MICROLAMPORTS
        value: "10000"
      - key: OPS_EVERY_MIN
        value: "10"
      - key: SITE_DOMAINS
        value: treid.fun,www.treid.fun,solodriver707-prog.github.io
      - key: RPC                 # Helius server key: https://mainnet.helius-rpc.com/?api-key=...
        sync: false
      - key: PARTNER             # treasury = your cold wallet (public address)
        sync: false
      - key: OPS_SECRET          # hot ops wallet private key — paste it only here, never in chat
        sync: false
      - key: PINATA_JWT
        sync: false
      - key: PUBLIC_URL          # this service's own https URL
        sync: false
      - key: JUP_API_KEY         # free key from developers.jup.ag (lite-api is being retired)
        sync: false
      - key: VAPID_PUBLIC        # web push: `npx web-push generate-vapid-keys` → public key (also served to the site)
        sync: false
      - key: VAPID_PRIVATE       # web push private key — only here, never in chat or the repo
        sync: false
      - key: VAPID_SUBJECT
        value: mailto:hello@treid.fun
      - key: TELEGRAM_BOT_TOKEN  # optional: operator alerts (ops halted / low SOL / stuck claims) — bot from @BotFather
        sync: false
      - key: TELEGRAM_CHAT_ID    # your chat id with that bot
        sync: false
